# Phase 1 (POC-collision fix) -- re-merges already-encoded/decoded shard
# artifacts with a corrected per-shard POC offset. NO re-encoding: this job
# only downloads existing tutrace-* artifacts from prior runs (by run-id) and
# re-runs a corrected merge. Fixes: raw shard CSVs report POC restarting at 0
# per shard (VTM has no knowledge of --FrameSkip when numbering POC inside a
# sub-encode), so the original merge_tu_trace.py concatenated colliding POC
# labels for every sharded sequence (Kimono, ParkScene -- the only two that
# needed sharding under the 6h/job cap). This workflow adds shard_idx *
# shard_frames to poc before merging, using the artifact-name-derived shard
# index and a caller-supplied shard size (64 for the original 2x64 inter
# shards, 32 for the Kimono-qp22 4x32 recovery, 8 for the AI-1080p 4x8
# shards). Aggregate eligibility-class stats (DCT2_LARGE/SMALL/MTS/
# UNSERVABLE, %MTS, etc.) were NEVER affected by this bug -- poc is not used
# in that accounting -- only per-frame/POC-level analysis was.
name: VTM TU Trace (POC fix -- re-merge existing shards, no re-encode)
run-name: 'POC fix -- ${{ inputs.config_tag }} (run ${{ inputs.run_id_a }})'
on:
  workflow_dispatch:
    inputs:
      config_tag:
        description: 'Config label to stamp in output (AI/RA/LDB/LDP)'
        required: true
        default: 'RA'
      run_id_a:
        description: 'Run ID holding the primary set of raw tutrace-* shard artifacts'
        required: true
      shard_frames_a:
        description: 'Shard size (frames) used when encoding run_id_a shards (64 inter / 8 AI-1080p)'
        required: true
        default: '64'
      run_id_b:
        description: 'Optional recovery run ID whose shards supersede one combo (0 = none)'
        required: false
        default: '0'
      shard_frames_b:
        description: 'Shard size for run_id_b (e.g. 32 for the Kimono-qp22 4x32 recovery)'
        required: false
        default: '32'
      exclude_prefix:
        description: 'Artifact-name prefix to drop from run_id_a when run_id_b supersedes it (e.g. tutrace-Kimono-qp22-)'
        required: false
        default: ''
jobs:
  refix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Write corrected merge tool
        run: |
          mkdir -p tools
          echo  | base64 -d > tools/merge_tu_trace_v2.py
      - name: Download primary shard artifacts (run_id_a)
        uses: actions/download-artifact@v4
        with:
          pattern: tutrace-*
          path: raw_a
          run-id: ${{ github.event.inputs.run_id_a }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download secondary shard artifacts (run_id_b)
        if: github.event.inputs.run_id_b != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: tutrace-*
          path: raw_b
          run-id: ${{ github.event.inputs.run_id_b }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Merge with corrected POC offsets
        run: |
          if [ "${{ github.event.inputs.run_id_b }}" != "0" ]; then
            python3 tools/merge_tu_trace_v2.py out --config "${{ github.event.inputs.config_tag }}" \
              --input raw_a --shard-frames "${{ github.event.inputs.shard_frames_a }}" --exclude "${{ github.event.inputs.exclude_prefix }}" \
              --input raw_b --shard-frames "${{ github.event.inputs.shard_frames_b }}"
          else
            python3 tools/merge_tu_trace_v2.py out --config "${{ github.event.inputs.config_tag }}" \
              --input raw_a --shard-frames "${{ github.event.inputs.shard_frames_a }}"
          fi
          echo "----- tu_summary.txt -----"; cat out/tu_summary.txt
      - name: Upload POC-corrected consolidated workload
        uses: actions/upload-artifact@v4
        with:
          name: tu-traces-${{ github.event.inputs.config_tag }}-pocfixed
          path: |
            out/tu_trace.csv
            out/tu_distribution.csv
            out/tu_summary.txt
          if-no-files-found: error
