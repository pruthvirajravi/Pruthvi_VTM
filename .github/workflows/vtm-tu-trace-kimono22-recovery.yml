# Phase 1 (Kimono-qp22 recovery) -- 4x32 frame shards for the ONE combo that busts the
# 6h/job cap even at 64-frame shards (Kimono, QP22) in the inter configs. Splitting into
# 4 shards of 32 frames halves each job to ~3h. For RA (intra period 32) the 32-frame
# boundary is intra-period-aligned -> ZERO bias; for low-delay it adds a few I-frames
# (~2% of frames, documented). The merge PULLS the 31 already-good combos from the prior
# run (prior_run_id) so it emits ONE complete tu-traces-<config>-complete trace.
name: VTM TU Trace (Phase 1 Kimono22 recovery)
run-name: 'Phase 1 Kimono22 recovery -- ${{ inputs.config_tag }} (4x32 shards, merge prior)'
on:
  workflow_dispatch:
    inputs:
      enc_cfg:
        description: 'Encoder cfg under cfg/ (encoder_randomaccess_vtm.cfg / encoder_lowdelay_vtm.cfg / encoder_lowdelay_P_vtm.cfg)'
        required: true
        default: 'encoder_randomaccess_vtm.cfg'
      config_tag:
        description: 'Short tag (RA/LDB/LDP)'
        required: true
        default: 'RA'
      prior_run_id:
        description: 'Run ID of the prior inter-shards run to merge the other 31 combos from'
        required: true
        default: '0'
      frames:
        description: 'Total inter frames (CTC)'
        required: false
        default: '128'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Write instrumentation tool
        run: |
          mkdir -p tools
          echo  | base64 -d > tools/inject_tu_trace.py
      - name: Instrument TrQuant.cpp
        run: python3 tools/inject_tu_trace.py .
      - name: Configure CMake
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
      - name: Build Encoder + Decoder
        run: cd build && make -j"$(nproc)" EncoderApp DecoderApp
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: vtm-binaries
          path: |
            bin/**/EncoderApp
            bin/**/DecoderApp
          if-no-files-found: error
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Restore/seed sequence cache
        id: seqcache
        uses: actions/cache@v4
        with:
          path: test_sequences
          key: vtm-test-sequences-v2
      - name: Download sequences ONCE (cache miss only, retry, verify complete)
        if: steps.seqcache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet gdown
          rm -rf test_sequences && mkdir -p test_sequences
          ok=0
          for i in 1 2 3 4 5 6; do
            gdown --folder "https://drive.google.com/drive/folders/17rwtLY3f49dQRy2CT2Jl1w5eTJdc3TvK" -O test_sequences || true
            n=$(find test_sequences -type f -iname '*.yuv' | wc -l)
            if [ "$n" -ge 8 ]; then ok=1; echo "got $n sequences"; break; fi
            echo "attempt $i: only $n/8 -- sleeping 60s"; sleep 60
          done
          if [ "$ok" != "1" ]; then echo "FAILED: <8 sequences"; rm -rf test_sequences; exit 1; fi
          find test_sequences -type f -iname '*.yuv' -printf '%f\n'
  trace:
    needs: [build, prep]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sequence: [Kimono]
        qp: ['22']
        shard: ['0', '1', '2', '3']
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: vtm-binaries
          path: bin
      - name: Restore sequences from cache (no Drive access)
        uses: actions/cache@v4
        with:
          path: test_sequences
          key: vtm-test-sequences-v2
      - name: Verify sequences present
        run: |
          if [ -z "$(find test_sequences -type f -iname '*.yuv' 2>/dev/null)" ]; then
            echo "sequence cache empty"; exit 1
          fi
      - name: Encode (inter; 1080p frame-sharded, small seqs whole)
        id: enc
        run: |
          set -u
          ENC="$(find bin -type f -name 'EncoderApp' | head -n1)"; chmod +x "$ENC"
          ENCCFG="${{ github.event.inputs.enc_cfg }}"
          FRAMES="${{ github.event.inputs.frames }}"; SHARD_FRAMES=32
          LABEL="${{ matrix.sequence }}"; QP="${{ matrix.qp }}"; SHARD=${{ matrix.shard }}
          case "$LABEL" in
            Kimono)      CFG=Kimono.cfg;      GLOB='*Kimono*1920x1080*.yuv';    SHARDED=1 ;;
            ParkScene)   CFG=ParkScene.cfg;   GLOB='*ParkScene*1920x1080*.yuv'; SHARDED=1 ;;
            RaceHorsesC) CFG=RaceHorsesC.cfg; GLOB='*RaceHorses*832x480*.yuv';  SHARDED=0 ;;
            BQMall)      CFG=BQMall.cfg;      GLOB='*BQMall*832x480*.yuv';      SHARDED=0 ;;
            RaceHorsesD) CFG=RaceHorses.cfg;  GLOB='*RaceHorses*416x240*.yuv';  SHARDED=0 ;;
            BQSquare)    CFG=BQSquare.cfg;    GLOB='*BQSquare*416x240*.yuv';    SHARDED=0 ;;
            FourPeople)  CFG=FourPeople.cfg;  GLOB='*FourPeople*1280x720*.yuv'; SHARDED=0 ;;
            Johnny)      CFG=Johnny.cfg;      GLOB='*Johnny*1280x720*.yuv';     SHARDED=0 ;;
            *) echo "unknown $LABEL"; exit 1 ;;
          esac
          CFG="cfg/per-sequence/$CFG"; mkdir -p encode_out
          YUV="$(find test_sequences -type f -iname "$GLOB" | head -n1)"
          if [ -z "$YUV" ]; then echo "YUV not found $LABEL"; exit 1; fi
          # true source length from file size (4:2:0 8-bit); never read past EOF
          DIMS=$(basename "$YUV" | grep -oE '[0-9]+x[0-9]+' | head -n1); W=${DIMS%x*}; H=${DIMS#*x}
          BYTES=$(stat -c%s "$YUV"); TOTAL=$((BYTES/(W*H*3/2)))
          LIMIT=$FRAMES; [ "$TOTAL" -lt "$FRAMES" ] && LIMIT=$TOTAL
          if [ "$SHARDED" = "1" ]; then
            # 1080p: shard 0 -> [0,64), shard 1 -> [64,LIMIT). Boundary aligns to RA intra
            # period 32; for low-delay it adds one I-frame at frame 64 (documented).
            FS=$((SHARD*SHARD_FRAMES))
            if [ "$FS" -ge "$LIMIT" ]; then echo "shard $SHARD past range (LIMIT=$LIMIT) -- skip"; : > "${LABEL}_qp${QP}.tutrace.csv"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            READ=$SHARD_FRAMES; [ $((FS+SHARD_FRAMES)) -gt "$LIMIT" ] && READ=$((LIMIT-FS))
          else
            # small sequence: encode whole in shard 0; shard 1 is a no-op
            if [ "$SHARD" != "0" ]; then echo "small seq shard $SHARD -- skip"; : > "${LABEL}_qp${QP}.tutrace.csv"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            FS=0; READ=$LIMIT
          fi
          echo "encoding $LABEL qp$QP shard $SHARD cfg $ENCCFG: TOTAL=$TOTAL --FrameSkip=$FS -f $READ"
          "$ENC" -c "cfg/$ENCCFG" -c "$CFG" -i "$YUV" \
            -b "encode_out/${LABEL}_qp${QP}_s${SHARD}.bin" -o /dev/null \
            -q "$QP" --FrameSkip=$FS -f "$READ"
      - name: Decode shard with TU trace ON
        if: steps.enc.outputs.skip != '1'
        env:
          VTM_TU_TRACE: ${{ github.workspace }}/${{ matrix.sequence }}_qp${{ matrix.qp }}.tutrace.csv
        run: |
          set -u
          DEC="$(find bin -type f -name 'DecoderApp' | head -n1)"; chmod +x "$DEC"
          "$DEC" -b "encode_out/${{ matrix.sequence }}_qp${{ matrix.qp }}_s${{ matrix.shard }}.bin" -o /dev/null
          echo "rows: $(wc -l < ${{ matrix.sequence }}_qp${{ matrix.qp }}.tutrace.csv)"
      - name: Upload per-shard trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # empty csv for skipped shards (merge ignores 0-row files); shard uniqueness in
          # the ARTIFACT name so same inner filename lands in separate download dirs.
          name: tutrace-${{ matrix.sequence }}-qp${{ matrix.qp }}-s${{ matrix.shard }}
          path: ${{ matrix.sequence }}_qp${{ matrix.qp }}.tutrace.csv
          if-no-files-found: error
  merge:
    needs: trace
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Write merge tool
        run: |
          mkdir -p tools
          echo  | base64 -d > tools/merge_tu_trace.py
      - name: Collect THIS run's Kimono-qp22 4x32 shards
        uses: actions/download-artifact@v4
        with:
          pattern: tutrace-*
          path: raw/cur
      - name: Pull prior run's shards (all other combos)
        uses: actions/download-artifact@v4
        with:
          pattern: tutrace-*
          path: raw/prev
          run-id: ${{ github.event.inputs.prior_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Drop prior Kimono-qp22 (superseded by this run's 4x32 shards)
        run: rm -rf raw/prev/tutrace-Kimono-qp22-* || true
      - name: Merge + classify (complete config trace)
        run: |
          python3 tools/merge_tu_trace.py raw out --config "${{ github.event.inputs.config_tag }}"
          echo "----- tu_summary.txt -----"; cat out/tu_summary.txt
      - name: Upload complete consolidated workload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tu-traces-${{ github.event.inputs.config_tag }}-complete
          path: |
            out/tu_trace.csv
            out/tu_distribution.csv
            out/tu_summary.txt
          if-no-files-found: error
