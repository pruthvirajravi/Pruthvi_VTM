# Kimono repair -- targeted re-run of Kimono sub-shards that failed a main
# vtm-tu-trace-inter-full-native.yml run because a 64-frame shard was too
# expensive to finish inside GitHub's 6h per-job cap. Originally written for
# RA run 30968011739 (3 failures: qp22 s0/s1, qp32 s1); generalized here via
# workflow_dispatch inputs (enc_cfg/config_tag/matrix_json) so it can be
# re-dispatched for any config (RA/LDB/LDP) and any set of failed shards
# without editing the file.
#
# Root cause: RA/LDB hierarchical-B motion search at 1920x1080 makes a
# 64-frame shard too expensive on a GitHub-hosted runner (Kimono/ParkScene
# at 1080p are far more expensive per-frame than the other 7 CTC sequences
# here, all <=832x480 or 720p). Blind re-run of the same 64-frame job would
# very likely fail the same way again -- CPU throughput on a GitHub-hosted
# runner is fixed, so nothing about a retry changes the wall-clock cost of
# the same work.
#
# Fix: halve the shard to 32 frames. This is still exactly 1 RA IntraPeriod
# (=32) GOP, so it introduces zero coding-structure bias vs the rest of the
# corpus (same rationale as the original 64-frame choice, just one GOP
# instead of two). Smaller frame count also reduces peak reference-picture
# memory, which plausibly helps runner "lost communication" (likely OOM)
# failures too, so those are repaired the same way as cheap insurance.
#
# matrix_json entries are {qp,label,frameskip,frames} sub-shards, e.g. a
# failed 64-frame shard N (FrameSkip=N*64) becomes two 32-frame sub-shards:
#   { qp, label: "Na", frameskip: N*64,    frames: 32 }
#   { qp, label: "Nb", frameskip: N*64+32, frames: 32 }
#
# This workflow does NOT include a merge job -- its small per-shard
# artifacts are combined locally with the target run's already-merged
# tu-traces-<config_tag>-full-native artifact.
name: VTM TU Trace (Kimono repair)
run-name: 'Kimono repair -- ${{ inputs.config_tag }} sub-shards'
on:
  workflow_dispatch:
    inputs:
      enc_cfg:
        description: 'Encoder cfg under cfg/ (encoder_randomaccess_vtm.cfg / encoder_lowdelay_vtm.cfg / encoder_lowdelay_P_vtm.cfg)'
        required: true
        default: 'encoder_randomaccess_vtm.cfg'
      config_tag:
        description: 'Short tag (RA/LDB/LDP) -- also tags the output artifact name'
        required: true
        default: 'RA'
      matrix_json:
        description: 'JSON array of {qp,label,frameskip,frames} Kimono sub-shards to repair'
        required: true
        default: '[{"qp":"22","label":"0a","frameskip":"0","frames":"32"},{"qp":"22","label":"0b","frameskip":"32","frames":"32"},{"qp":"22","label":"1a","frameskip":"64","frames":"32"},{"qp":"22","label":"1b","frameskip":"96","frames":"32"},{"qp":"32","label":"1a","frameskip":"64","frames":"32"},{"qp":"32","label":"1b","frameskip":"96","frames":"32"}]'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Write instrumentation tool
        run: |
          mkdir -p tools
          echo  | base64 -d > tools/inject_tu_trace.py
      - name: Instrument TrQuant.cpp
        run: python3 tools/inject_tu_trace.py .
      - name: Configure CMake
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
      - name: Build Encoder + Decoder
        run: cd build && make -j"$(nproc)" EncoderApp DecoderApp
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: vtm-binaries
          path: |
            bin/**/EncoderApp
            bin/**/DecoderApp
          if-no-files-found: error
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Restore/seed sequence cache
        id: seqcache
        uses: actions/cache@v4
        with:
          path: test_sequences
          key: vtm-test-sequences-v2
      - name: Download sequences ONCE (cache miss only, retry, verify complete)
        if: steps.seqcache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet gdown
          rm -rf test_sequences && mkdir -p test_sequences
          ok=0
          for i in 1 2 3 4 5 6; do
            gdown --folder "https://drive.google.com/drive/folders/17rwtLY3f49dQRy2CT2Jl1w5eTJdc3TvK" -O test_sequences || true
            n=$(find test_sequences -type f -iname '*.yuv' | wc -l)
            if [ "$n" -ge 8 ]; then ok=1; echo "got $n sequences"; break; fi
            echo "attempt $i: only $n/8 -- sleeping 60s"; sleep 60
          done
          if [ "$ok" != "1" ]; then echo "FAILED: <8 sequences"; rm -rf test_sequences; exit 1; fi
          find test_sequences -type f -iname '*.yuv' -printf '%f\n'
  trace:
    needs: [build, prep]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: vtm-binaries
          path: bin
      - name: Restore sequences from cache (no Drive access)
        uses: actions/cache@v4
        with:
          path: test_sequences
          key: vtm-test-sequences-v2
      - name: Verify sequences present
        run: |
          if [ -z "$(find test_sequences -type f -iname '*.yuv' 2>/dev/null)" ]; then
            echo "sequence cache empty"; exit 1
          fi
      - name: Encode sub-shard -> .bin (Kimono only, 32-frame windows)
        run: |
          set -u
          ENC="$(find bin -type f -name 'EncoderApp' | head -n1)"; chmod +x "$ENC"
          ENCCFG="${{ inputs.enc_cfg }}"
          QP="${{ matrix.qp }}"; LABEL="${{ matrix.label }}"
          FS="${{ matrix.frameskip }}"; WANT="${{ matrix.frames }}"
          CFG="cfg/per-sequence/Kimono.cfg"; mkdir -p encode_out
          YUV="$(find test_sequences -type f -iname '*Kimono*1920x1080*.yuv' | head -n1)"
          if [ -z "$YUV" ]; then echo "YUV not found"; exit 1; fi
          BYTES=$(stat -c%s "$YUV"); FRAME_BYTES=$((1920*1080*3/2)); TOTAL=$((BYTES/FRAME_BYTES))
          REMAIN=$((TOTAL-FS))
          if [ "$REMAIN" -le 0 ]; then echo "past EOF (TOTAL=$TOTAL)"; exit 0; fi
          READ=$WANT; [ "$REMAIN" -lt "$WANT" ] && READ=$REMAIN
          echo "encoding Kimono qp$QP cfg $ENCCFG FrameSkip=$FS -f $READ (TOTAL=$TOTAL)"
          "$ENC" -c "cfg/$ENCCFG" -c "$CFG" -i "$YUV" \
            -b "encode_out/Kimono_qp${QP}_s${LABEL}.bin" -o /dev/null \
            -q "$QP" --FrameSkip="$FS" -f "$READ"
      - name: Decode sub-shard with TU trace ON
        env:
          VTM_TU_TRACE: ${{ github.workspace }}/Kimono_qp${{ matrix.qp }}.tutrace.csv
        run: |
          set -u
          DEC="$(find bin -type f -name 'DecoderApp' | head -n1)"; chmod +x "$DEC"
          "$DEC" -b "encode_out/Kimono_qp${{ matrix.qp }}_s${{ matrix.label }}.bin" -o /dev/null
          echo "rows: $(wc -l < Kimono_qp${{ matrix.qp }}.tutrace.csv)"
      - name: Upload per-shard trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutrace-Kimono-${{ inputs.config_tag }}-qp${{ matrix.qp }}-s${{ matrix.label }}
          path: Kimono_qp${{ matrix.qp }}.tutrace.csv
          if-no-files-found: error
